SPECIFICATION Spec

\* Constants
CONSTANTS
    Contexts = {background, content, popup}
    MaxMessages = 4
    Tabs = {0, 1, 2}
    TimeoutLimit = 3

\* Invariants to check
INVARIANTS
    TypeOK
    NoRoutingLoops
    DeliveredWerePending
    NoOrphanedRequests

\* Properties to check
PROPERTIES
    EventualResolution
    ConnectedEventuallyDelivers

\* State constraint (keep state space manageable).
\* polly#172: TLC's CONSTRAINT clause takes a defined operator, not an inline
\* expression — an inline one stops the run before it reaches the properties.
CONSTRAINT
    BoundedMessages
